<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Embed</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/insta.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Roboto&display=swap" rel="stylesheet">
</head>
<body>


    <blockquote class="instagram-media" 
        data-instgrm-permalink="https://www.instagram.com/p/DFzVRc-SbTJ/?utm_source=ig_embed&amp;utm_campaign=loading" 
        data-instgrm-version="14">
        <div class="instagram-container">
            <a href="https://www.instagram.com/p/DFzVRc-SbTJ/?utm_source=ig_embed&amp;utm_campaign=loading" target="_blank">
                <div class="instagram-header">
                    <div class="profile-pic"></div>
                    <div class="profile-info">
                        <div class="profile-name"></div>
                        <div class="profile-handle"></div>
                    </div>
                </div>
                <div class="instagram-placeholder"></div>
                <div class="instagram-icon"></div>
                <div class="instagram-caption"></div>
                <p class="instagram-credit">
                    <a href="https://www.instagram.com/p/DFzVRc-SbTJ/?utm_source=ig_embed&amp;utm_campaign=loading">A post shared by sakura (@nailpartii)</a>
                </p>
            </a>
        </div>
    </blockquote>

<!-- Scripts -->
    <script src="scripts/script.js"></script>
    <script src="scripts/insta.js"></script>
    <script async src="//www.instagram.com/embed.js"></script>
</body>
</html>
